<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#FFFFFF"/>
  <!-- Four pillars arranged in diamond. Top = Evaluate. Left = Define. Right = Govern. Bottom = Elevate (gold). -->
  <!-- Top pillar (E) -->
  <polygon points="256,100 200,256 312,256" fill="#14264C"/>
  <!-- Left pillar (D) -->
  <polygon points="100,256 256,200 256,312" fill="#14264C"/>
  <!-- Right pillar (G) -->
  <polygon points="412,256 256,200 256,312" fill="#14264C"/>
  <!-- Bottom pillar (E) - gold accent -->
  <polygon points="256,412 200,256 312,256" fill="#D89A55"/>
</svg>
